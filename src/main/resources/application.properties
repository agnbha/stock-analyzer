# Groww Trading API credentials (https://groww.in/trade-api/api-keys)
#
# LEAVE THESE BLANK. This file is committed to a public repository and bundled into the jar.
# Put the real values in ~/.stock-analyzer.env: an environment variable overrides the same key here
# (groww.api.key -> GROWW_API_KEY), and ops/bin/common.sh loads that file for every scheduled job.
# ConfigCredentialsTest fails the build if a value is put back.
#
# Groww issues a pair per login flow, and these settings use Groww's own names for them:
#   API key flow  - Groww's "API key" and "API secret"      groww.api.key, groww.api.secret
#   TOTP flow     - Groww's "TOTP token" and "TOTP secret"  groww.totp.token, groww.totp.secret
# The TOTP token is what Groww's SDK passes as api_key. The TOTP secret is the Base32 seed a
# six-digit code is made from; it is never sent. Each flow reads only its own pair.

# API key flow: Groww's "API key".
groww.api.key=

# How the access token is obtained:
#   checksum - API key + API secret, signed as SHA-256(secret + timestamp). Groww asks for
#              a fresh approval of this key each day.
#   totp     - TOTP token + a current six-digit code made from the TOTP secret, the same
#              pairing the Python SDK exposes as get_access_token(api_key=<token>, totp=...)
# Only the credentials the chosen mode needs have to be set.
groww.auth.mode=checksum

# API key flow (groww.auth.mode=checksum): Groww's "API secret".
groww.api.secret=

# TOTP flow (groww.auth.mode=totp): Groww's "TOTP token", the long JWT shown when you generate
# a TOTP token. (A setup from before this setting existed put it in groww.api.key; that still
# works when this is blank.)
groww.totp.token=

# TOTP flow: Groww's "TOTP secret", the Base32 seed shown next to the token (the string an
# authenticator app would scan). Codes are derived from the system clock, so keep the
# machine's time accurate.
groww.totp.secret=
groww.base.url=https://api.groww.in/v1
groww.exchange=NSE
groww.segment=CASH

# 1440 = daily candles. See https://groww.in/trade-api/docs/curl/historical-data
# for other supported intervals (1, 5, 10, 60, 240, 1440, 10080).
groww.candle.interval.minutes=1440
groww.lookback.days=30

# Candle window used to derive fundamentals (week-52 high/low etc.) when the
# API key doesn't have Groww's "Live Data" entitlement enabled. 365 = a full
# trailing year, matching a true 52-week high/low.
groww.fundamentals.lookback.days=365

# External growth-pattern ML service. Point this at whatever model-serving
# endpoint you stand up; it must accept the JSON shape documented in
# com.stockanalyzer.ml.GrowthAnalysisRequest and return the shape documented
# in com.stockanalyzer.ml.GrowthAnalysisResponse.
ml.service.url=http://localhost:8000/analyze
ml.service.timeout.seconds=30

# List of symbols to analyze, one per line, on the classpath.
app.symbols.file=symbols.txt

# Number of symbols fetched/analyzed concurrently. Groww's "non-trading" rate
# limit is 20 req/sec and 500 req/min; keep this modest to stay under it.
app.fetch.concurrency=5

# ----------------------------------------------------------------------------
# Part 1 - intraday analysis and the local database
# ----------------------------------------------------------------------------
# Candle size for the top-3 gain analysis. 1 = one-minute candles; raise to 5 if
# the provider's one-minute history is too shallow for a multi-month backfill.
intraday.candle.interval.minutes=1
intraday.top.n=3
# HIGH_LOW measures entry-low to exit-high (what the tape actually offered).
# CLOSE_CLOSE is the conservative reading.
intraday.price.basis=HIGH_LOW
# The exit must be at least this many candles after the entry, and at least this many minutes. A buy and a
# sell a minute apart leave no time to act on either, so a window must last five minutes or more. The larger
# of the two minimums wins; both are part of the detector version, so changing either writes a parallel
# series (run 'DailyAnalysisMain recompute --from <date>' to rebuild the history under the new one).
intraday.min.hold.candles=1
intraday.min.hold.minutes=5
# Windows below this gain are not recorded, so a day whose best move never
# clears it yields no top-3 at all. Set above the round-trip cost of a trade
# (roughly 0.05-0.15% in brokerage, taxes and slippage) so that a recorded
# window always describes a move worth acting on rather than noise.
intraday.min.gain.pct=0.5
# Keeping raw candles is what makes 'recompute' possible without refetching.
intraday.store.raw.candles=true

db.url=jdbc:sqlite:data/stock-analyzer.db
db.busy.timeout.ms=5000

# Request ceilings, enforced across every thread in the process by one shared
# limiter. These defaults are deliberately conservative: they sit well under the
# limits published for non-trading endpoints, because being throttled mid-session
# costs far more than a backfill finishing a few minutes later.
#
# Confirm the current numbers for the historical-data endpoints at
# https://groww.in/trade-api/docs before raising them - historical data is
# usually capped lower than the general non-trading figure.
#
# What these allow in practice: a 50-symbol daily run finishes in ~10s, a
# 3-month backfill in ~8 minutes, and the live monitor uses about a sixth of the
# per-minute budget.
ingest.rate.limit.per.second=5
ingest.rate.limit.per.minute=120
# A guardrail against one runaway process, not an account-wide ledger: the count
# lives in memory and resets when the process restarts. 0 disables it.
#
# Set this above what a full day actually costs, or the daemon will simply stop
# fetching part-way through the session. The arithmetic that matters:
#
#   monitor  = (session minutes x 60 / poll interval) x symbols
#            = (375 x 60 / 180) x 62 = 7,750 requests per session, plus
#              (375 x 60 / 10) = 2,250 for every symbol traded that day
#   fills    = at most (orders + 1) a minute while the daemon runs: 7 orders was
#              the busiest day so far, so about 3,000 a session
#   nightly  = symbols = 62
#   backfill = (days / chunk days) x symbols, so 3 months is about 950
#
# Doubling monitor.poll.interval.seconds halves the slow share. The daemon warns
# at startup if the session it is about to run would not fit in this budget, and
# says how many traded symbols it has room to follow at the active speed (about
# 14 at 40,000; the fill import is small beside that).
ingest.rate.limit.per.day=40000
ingest.max.retries=4
ingest.retry.backoff.ms=500
# Intraday history endpoints cap how much one request may span.
backfill.max.days.per.request=5

# ----------------------------------------------------------------------------
# Part 2 - the time-of-day prior and the model
# ----------------------------------------------------------------------------
# Left off until a trained model beats the statistical baseline on a held-out
# month. Everything works without it.
model.enabled=false
model.service.url=http://localhost:8001/predict/intraday
model.horizon.minutes=30
model.timeout.seconds=20
hotwindow.bucket.minutes=5
hotwindow.lookback.days=60

# ----------------------------------------------------------------------------
# Part 3 - alerts
# ----------------------------------------------------------------------------
# There is one alert: when you have bought something, it says when to sell. Everything bought in a
# symbol today has a single average buy price (weighted by quantity, so buys at different prices
# are combined). The first time the price reaches each target below, one alert says "sell now" and
# gives the limit price to set: the target rounded up to the next tick, so the order can fill at
# once. Buying more changes the average and so the targets; a position you have sold out gets none.
alerts.sell.targets.pct=0.6,1.0
# The smallest price step in rupees; the limit price is rounded up to it.
alerts.sell.tick.size=0.05
# A target last touched longer ago than this is not announced: the moment has passed, and it stops a
# restart announcing the morning.
alerts.max.age.minutes=10
# Comma-separated: console, macos, file. macos is a desktop notification (see README).
alerts.sinks=console,macos
# The least severe alert that reaches the desktop: INFO, NOTABLE or URGENT. Sell alerts are URGENT.
alerts.desktop.min-severity=NOTABLE
alerts.file.path=data/alerts.jsonl
# The next three tune the baseline entry signal (predictions that are recorded and scored the next
# day), not an alert. They keep their old names. Thin statistics make noise, not signal: a window
# needs this much evidence, and the day's low - and so the start of a top-3 window - often sits at
# the open, so windows starting within a few minutes of it are ignored.
alerts.hotwindow.min-sessions=30
alerts.hotwindow.min-lcb=0.10
alerts.hotwindow.skip-opening-minutes=5
# Forward-looking holidays; inferred ones only work backwards.
alerts.holidays.file=nse-holidays-2026.txt

# ----------------------------------------------------------------------------
# Notes written on the charts
# ----------------------------------------------------------------------------
# `chartnotes sync` (run by evening.sh) copies the notes written on the Grafana charts into this database, which
# otherwise holds them only in Grafana's own file. Under Docker that file is in a volume: point this at a copy of it.
grafana.db.path=grafana/.runtime/data/grafana.db
# The generic sentiments a note is counted under, and the home-made labels that stand for them: a note tagged UP
# is counted as BULLISH, LEVEL as NEUTRAL. Any other label (NERVOUS, CALM) is still kept, just not read as a view.
notes.sentiments=BULLISH,BEARISH,NEUTRAL
notes.sentiment.aliases=UP=BULLISH,UPTREND=BULLISH,LONG=BULLISH,DOWN=BEARISH,DOWNTREND=BEARISH,SHORT=BEARISH,LEVEL=NEUTRAL,FLAT=NEUTRAL,SIDEWAYS=NEUTRAL,RANGE=NEUTRAL

# ----------------------------------------------------------------------------
# Part 4 - live monitoring
# ----------------------------------------------------------------------------
# How often every tracked symbol is scanned: three minutes is enough to follow the market.
monitor.poll.interval.seconds=180
# A symbol with a fill today (a buy or a sell, in the journal) is scanned this often instead, so a position is
# watched closely and its sell targets are announced within seconds of the price getting there. A trade is
# picked up once it has been imported (trades.live.import.interval.minutes), so allow that long for a new one.
monitor.active.poll.interval.seconds=10
monitor.session.open=09:15
monitor.session.close=15:30
monitor.timezone=Asia/Kolkata
monitor.post.close.grace.seconds=120
monitor.view.ansi=true

# ----------------------------------------------------------------------------
# The Watchlist's shortlist
# ----------------------------------------------------------------------------
# How many symbols the evening step writes down as that night's shortlist (the highest trend scores among
# complete sessions). The Watchlist page reads how those picks did on the next session; see grafana/README.md.
watchlist.top=5

# ----------------------------------------------------------------------------
# Part 5 - the trade journal
# ----------------------------------------------------------------------------
trades.source=broker
trades.csv.date.format=yyyy-MM-dd HH:mm:ss
trades.default.product=MIS
# While the daemon runs it pulls the day's fills from the broker this often, so a buy or
# sell shows on Candles and Calls, and the symbol moves to the faster scan, within a minute.
# Each import costs one request for the order list and one per order. 0 leaves it to the
# evening batch.
trades.live.import.interval.minutes=1
# Broker-reported charges always win when they are present; the rates below
# only cover manual and CSV trades. Verify them against a real contract note.
charges.prefer.broker.actuals=true
charges.brokerage.intraday.pct=0.05
charges.brokerage.intraday.max=20
charges.brokerage.delivery.pct=0.0
charges.stt.intraday.sell.pct=0.025
charges.stt.delivery.pct=0.1
charges.exchange.txn.pct=0.00297
charges.sebi.pct=0.0001
charges.stamp.duty.buy.pct=0.003
charges.gst.pct=18
report.fy.start.month=4

# ----------------------------------------------------------------------------
# CAN SLIM - William O'Neil's growth-stock rules (CanSlimMain)
# ----------------------------------------------------------------------------
# screener.in runs the fundamental filter (C, A, I); price action, relative
# strength and the market are evaluated locally from daily candles.
#
# Custom queries need a signed-in screener.in account. Sign in in a browser (the
# Google button is fine), copy the 'sessionid' cookie for www.screener.in, and
# export it - never commit it here:
#   export SCREENER_SESSION_ID=...
# screener.session.id=
screener.base.url=https://www.screener.in
# Ratio names are screener.in's own. Each one mentioned is also returned as a
# column, which is how the C, A and I letters get their numbers - a query that
# leaves one out leaves that letter unknown.
canslim.screener.query=YOY Quarterly profit growth > 25 AND \
  YOY Quarterly sales growth > 20 AND \
  Profit growth 3Years > 25 AND \
  Return on equity > 17 AND \
  Change in FII holding + Change in DII holding > 0 AND \
  Market Capitalization > 1000
# The query is one request for the first page of results. screener.in's robots.txt asks
# automated clients not to use its page/limit/sort parameters, so there is no paging: keep the
# query tight enough that what you want fits on one page. A result with more says so.
# Company pages: screener.in answers a burst of ~7 quick reads with HTTP 429 and then admits about one
# every ten seconds, so they are read 12 s apart, with a 60 s pause and one retry if it says 429 anyway.
canslim.screener.request.interval.ms=12000
canslim.screener.rate.limit.backoff.ms=60000
canslim.max.candidates=150
# Without a screener.in session the query cannot run, but C, A and I are still
# read for holdings and the configured symbols from screener.in's public company
# pages (a page per symbol, 12 seconds apart). The figures change when a company
# reports a quarter, so a page is read again by the calendar, not on a timer:
#  - a copy showing the latest ended quarter is left alone until the next one ends;
#  - from 8 to 60 days after a quarter ends, a company still showing the old one is
#    looked at again every season.check.days;
#  - pages with no figures (ETFs), and companies still missing the quarter after the
#    60-day deadline, are retried every cache.days.
canslim.fundamentals.season.check.days=2
canslim.fundamentals.cache.days=7
# At 12 s a page, 60 pages is 12 minutes. A first scan has hundreds to read (holdings, the universe, the
# market's leaders, strongest RS first); it fills the cache over several nights instead of one long one.
canslim.fundamentals.max.pages.per.run=60
# The company details under the chart on Candles and Calls (market cap, P/E, quarterly revenue and profit,
# shareholding, what the company does) come from the same public pages, read by 'CanSlimMain profiles' for
# the symbols in symbols.txt. A copy is read again after this many days, never-read companies first and then
# the oldest, at most this many pages a night at the same 12 s pace: 12 pages a night turns 62 companies
# over in about a week and costs the evening batch under three minutes. 0 reads every company that is due.
company.profile.refresh.days=7
company.profile.max.pages.per.run=12
# The market proxy for M. NIFTYBEES tracks the Nifty 50.
canslim.market.index.symbol=NIFTYBEES
# A year of sessions plus the run-in for the 200-day average.
canslim.history.days=400
# Price the configured symbols too: a wider field for the RS rating, and sell
# signals for what is traded day to day.
canslim.include.universe=true

# Whole market. With canslim.market.enabled=true (or `CanSlimMain scan --market`) the scan also
# prices every listed NSE/BSE equity from Groww's instrument list and ranks them all together, so
# the RS rating is a percentile of the market and not of a hand-picked field. About 2,800 symbols
# on the main boards, one candle request each: allow 20-45 minutes, off market hours.
canslim.market.enabled=false
canslim.market.catalog.url=https://growwapi-assets.groww.in/instruments/instrument.csv
canslim.market.catalog.cache=data/instruments.csv
canslim.market.catalog.max.age.hours=24
canslim.market.exchanges=NSE,BSE
# A company listed on both is taken once, from NSE. BSE adds only companies NSE does not list.
canslim.market.nse.series=EQ,BE,BZ
canslim.market.bse.series=A,B,T,Z,P,ZP,TS
# The SME platforms (NSE SM/ST/SZ, BSE X/XT/M/MT/MS) add ~3,000 symbols that barely trade; the
# liquidity test below would rank almost none of them. Turn on to price them anyway.
canslim.market.include.sme=false
# Symbols never priced, comma-separated, spelled as in the instrument list (an NSE BE/BZ-series name keeps its
# suffix). The instrument list carries them but Groww's candle API will not serve them: it answers "Please provide
# correct value of trading symbol" (HTTP 400 GA001) or returns no candles at all, so every scan would spend a
# request on each and report a failure. A company left out here is not picked up again under its other exchange.
canslim.market.exclude=\
  UNIVAFOODS-BE,BLUECHIP-BE,CLCIND-BE,DIGJAMLMTD-BE,MORARJEE-BZ,ORTEL-BZ,\
  ADJIA,ADLINE,ALNATRD,ASHOKRE,ASUTENT,ASYL,BARONINF,BENGALS,BENTCOM,BHATEXT,CITURGIA,COLAB,CORAGRO,CRAFTROOT,\
  EASYFIN,FFPL,HVL,JAYTEX,KLIFESTYL,LADIAMO,MEENST,MSRINDIA,OSWALEA,PITHP,PUNCTRD,SHYAM,SKILVEN,STURDY,SVAINDIA,\
  SYBLY,TERRAFORM,TERRAREAL,VIJAYTX,ZMANSOON,ZNILKENG,ZNIVITRD,ZSHERAPR,ZSOUTGAS,ZSPEEDCO
# A listing Groww refuses (HTTP 400 GA001 "Please provide correct value of trading symbol", or no daily
# bars) is remembered in the market_reject table and not asked about again for this many days; then it is
# tried once more, and forgotten if it is being served. 0 asks about every listing every scan. Only
# listings are skipped, never a holding or a configured symbol, and if one scan is refused far more
# listings than dead symbols could explain, none of them is remembered.
canslim.market.reject.days=30
# Priced but not ranked unless: this many sessions of history, a last close at least this high (rupees),
# an average daily value traded (close x volume, 50 sessions) at least this high, and a bar this recent.
canslim.market.min.sessions=126
canslim.market.min.price=10
canslim.market.min.turnover=10000000
canslim.market.max.stale.days=10
# A listing's company page is read only once its RS rating reaches this: below the L bar it cannot be a buy.
canslim.market.fundamentals.min.rs=80
# Only companies above this market capitalisation (rupees crore) are selected. No bulk source of market caps
# exists, so the figure comes from each company's screener.in page, read for the stocks that rank high
# enough to be a buy: until a listing's page has been read it is not selected, and one found at or under
# the floor is remembered and left out of the RS ranking from then on.
canslim.market.min.market.cap.cr=1000
# Whole-market scores are thousands of rows a night; keep the newest N scans' worth.
canslim.market.keep.runs=30
canslim.market.report.top=50

# Rule thresholds. O'Neil's numbers unless noted.
canslim.min.qtr.profit.growth.pct=25
canslim.min.qtr.sales.growth.pct=20
canslim.min.profit.growth.3y.pct=25
canslim.min.roe.pct=17
canslim.max.pct.from.high=15
canslim.min.up.down.volume.ratio=1.0
canslim.min.rs.rating=80
canslim.breakout.volume.ratio=1.4
canslim.buy.range.pct=5
canslim.watch.within.pct=5
canslim.stop.loss.pct=8
# A climax run: this much in three weeks, once at least climax.min.gain.pct above the buy point.
canslim.climax.run.pct=25
canslim.climax.min.gain.pct=20
canslim.max.base.depth.pct=35
